name: Android CI

# Kids TV MMHY: kiểm thử đơn vị → APK (debug + release, ký bằng khóa cố định trong repo)
# → chạy thử trên máy ảo màn hình TV 1920x1080 với YouTube GIẢ (chụp ảnh từng bước).
# Kết quả (APK, kết quả kiểm thử, ảnh màn hình) được tải lên mục Artifacts của lần chạy
# và đẩy vào nhánh "ci-artifacts" (chỉ giữ bản mới nhất) để tải nhanh.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk: ${{ steps.apk.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare output folder
        run: mkdir -p ci-out/logs ci-out/test-results

      - name: Unit tests (lịch âm, bài toán, mật khẩu ngày, thời tiết)
        id: test
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee ci-out/logs/1-test.txt

      - name: Build APKs (Kids TV debug + release, YouTube giả)
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease :fakekids:assembleDebug 2>&1 | tee ci-out/logs/2-assemble.txt

      - name: Inspect APKs
        id: apk
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          : > ci-out/apk-info.txt
          for APK in app/build/outputs/apk/debug/MMHY-KidsTV-debug.apk app/build/outputs/apk/release/MMHY-KidsTV-release.apk fakekids/build/outputs/apk/debug/FakeYTKids-debug.apk; do
            [ -f "$APK" ] || continue
            cp "$APK" ci-out/
            {
              echo "################ $(basename "$APK")"
              echo "== Kích thước"; ls -l "$APK"
              echo "== SHA-256"; sha256sum "$APK"
              echo "== Build tools"; basename "$BT"
              echo "== Badging"; "$BT/aapt2" dump badging "$APK" | head -40
              echo "== Quyền"; "$BT/aapt2" dump permissions "$APK"
              echo "== Chữ ký"; "$BT/apksigner" verify --print-certs "$APK" 2>&1 | head -10
              echo
            } >> ci-out/apk-info.txt
          done
          test -f ci-out/MMHY-KidsTV-release.apk
          test -f ci-out/MMHY-KidsTV-debug.apk
          test -f ci-out/FakeYTKids-debug.apk
          unzip -l ci-out/MMHY-KidsTV-release.apk > ci-out/apk-contents.txt
          cat ci-out/apk-info.txt
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - name: Collect reports
        if: always()
        run: |
          cp -r app/build/test-results/. ci-out/test-results/ 2>/dev/null || true
          echo "test=${{ steps.test.outcome }}" > ci-out/outcomes.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kids-tv-build
          path: ci-out
          if-no-files-found: warn

      - name: Fail if unit tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "Unit test: ${{ steps.test.outcome }}"
          exit 1

  emulator:
    name: Run on TV-sized emulator
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.apk == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kids-tv-build
          path: ci-out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kiosk checks on emulator (Android 12)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/emulator-checks.sh ci-out/MMHY-KidsTV-release.apk ci-out/FakeYTKids-debug.apk emulator-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kids-tv-emulator
          path: emulator-out
          if-no-files-found: warn

  publish:
    name: Publish to ci-artifacts branch
    needs: [ build, emulator ]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Push latest outputs
        run: |
          cd out
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "build=${{ needs.build.result }}"
            echo "emulator=${{ needs.emulator.result }}"
            echo "time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD-INFO.txt
          git init -q -b ci-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI #${GITHUB_RUN_NUMBER} ${GITHUB_SHA::7}: build=${{ needs.build.result }}, emulator=${{ needs.emulator.result }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-artifacts
